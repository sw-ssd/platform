version: '3'

tasks:
  dev:
    desc: Vite 開發伺服器（預設 http://localhost:5173）
    cmd: pnpm dev
  build:
    desc: 型別檢查 + 產出
    cmd: pnpm build
  typecheck:
    desc: 型別檢查
    cmd: pnpm typecheck
  lint:
    desc: ESLint
    cmd: pnpm lint
  test:
    desc: 全部測試
    cmd: pnpm test
  gen:
    desc: proto / errcode 生成（來源在 product 倉 backend，此處僅為文件入口）
    cmds:
      - echo "產生檔來源位於 sales-order-dispatch/backend："
      - echo "  - proto: task proto:gen （輸出路徑含 platform-console/src/lib/proto）"
      - echo "  - errcode: task errcode:gen （輸出路徑含 platform-console/src/lib/errcode.ts）"
      - echo "請於 product 倉執行後，將變更複製/提交回本倉。"
